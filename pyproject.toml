[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iso-audit"
version = "0.2.0"
description = "Find the ISO 4217 currency codes and ISO 3166 country codes a codebase still uses after the standard withdrew them"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yu2971512385-ui" }]
keywords = ["iso4217", "iso3166", "currency", "country-codes", "linting", "data-quality", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/yu2971512385-ui/iso-audit"
Issues = "https://github.com/yu2971512385-ui/iso-audit/issues"

[project.scripts]
iso-audit = "iso_audit:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pycountry>=23"]

[tool.setuptools.packages.find]
include = ["iso_audit*"]

[tool.pytest.ini_options]
testpaths = ["test_iso_audit.py"]
